name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Test & Typecheck
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Build
  # Validates the package actually builds and packs cleanly, and uploads dist/
  # so the release job (below) doesn't need to rebuild.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 — Release & Publish
  # Creates a GitHub Release and publishes to public npm on every push to main
  # when the version in package.json changes. Unlike liyaengine-core (which
  # publishes to GitHub Packages, a private-ish registry appropriate for an
  # internal engine dependency), this is a public developer-facing SDK, so it
  # publishes to registry.npmjs.org with a real NPM_TOKEN secret.
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Read the version from package.json and check if this version was
      # already released — makes CI re-runnable on docs-only commits.
      - name: Check if release already exists
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

          if git ls-remote --tags origin "refs/tags/v$PKG_VERSION" | grep -q .; then
            echo "already_released=true" >> $GITHUB_OUTPUT
            echo "⏭️  v$PKG_VERSION tag already exists — skipping release"
          else
            echo "already_released=false" >> $GITHUB_OUTPUT
            echo "🚀 Publishing v$PKG_VERSION"
          fi

      - name: Download dist artifact
        if: steps.version_check.outputs.already_released == 'false'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        if: steps.version_check.outputs.already_released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          name: "@liyaengine/sdk v${{ steps.version_check.outputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version_check.outputs.version, '-') }}

      # --ignore-scripts skips `prepublishOnly` (build) — dist/ is already
      # present from the artifact downloaded above.
      - name: Publish to npm
        if: steps.version_check.outputs.already_released == 'false'
        run: npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
